<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WHEP playback test</title>
<style>
  body { margin: 0; background: #111827; color: #e5e7eb; font: 18px system-ui; }
  header { padding: 18px 28px; }
  video { width: 100%; max-height: 80vh; background: black; display: block; }
  form { padding: 12px 28px; display: flex; gap: 8px; flex-wrap: wrap; }
  input { min-width: 180px; flex: 1; }
  input, button { font: inherit; padding: 8px; }
</style>
<header>WHEP playback <span id="status">— ready</span></header>
<form id="controls"><input id="endpoint" type="url" aria-label="WHEP endpoint" placeholder="WHEP endpoint" required><button id="play">Play</button><button id="audio" type="button">Enable audio</button><button id="stop" type="button">Stop</button></form>
<video autoplay playsinline muted></video>
<script>
// Independent WHEP receiver: standard HTTP + RTCPeerConnection only.
// No VDO.Ninja page, SDK, signaling connection or data channel is used.
const video = document.querySelector('video');
let pc, resource, etag, audioContext, analyser;
window.requests = [];
async function request(url, options) {
  const response = await fetch(url, options);
  requests.push({ method: options.method, status: response.status });
  return response;
}
function gathered(connection) {
  if (connection.iceGatheringState === 'complete') return Promise.resolve();
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => reject(Error('ICE gathering timed out')), 12000);
    connection.addEventListener('icegatheringstatechange', () => {
      if (connection.iceGatheringState === 'complete') { clearTimeout(timer); resolve(); }
    });
  });
}
window.startPlayback = async (endpoint, trickle = false, videoCodec = 'H264') => {
  if (pc && pc.connectionState !== 'closed') throw Error('Stop the current playback first');
  resource = null; etag = null;
  pc = new RTCPeerConnection({ bundlePolicy: 'max-bundle', iceServers: window.playerIceServers || [
    { urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun.cloudflare.com:3478' }
  ] });
  const stream = new MediaStream();
  pc.ontrack = event => {
    stream.addTrack(event.track);
    video.srcObject = stream;
    video.play().catch(() => {});
    if (event.track.kind === 'audio') {
      audioContext = new AudioContext();
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 4096;
      audioContext.createMediaStreamSource(new MediaStream([event.track])).connect(analyser);
      const silent = audioContext.createGain(); silent.gain.value = 0;
      analyser.connect(silent).connect(audioContext.destination);
      audioContext.resume();
    }
  };
  const transceiver = pc.addTransceiver('video', { direction: 'recvonly' });
  const codecs = RTCRtpReceiver.getCapabilities('video').codecs.filter(
    codec => codec.mimeType.toLowerCase() === 'video/' + videoCodec.toLowerCase());
  if (!codecs.length) throw Error('This browser has no ' + videoCodec + ' decoder');
  transceiver.setCodecPreferences(codecs);
  pc.addTransceiver('audio', { direction: 'recvonly' });
  await pc.setLocalDescription(await pc.createOffer());
  if (!trickle) await gathered(pc);
  const response = await request(endpoint, { method: 'POST',
    headers: { 'Content-Type': 'application/sdp' }, body: pc.localDescription.sdp });
  if (response.status !== 201) throw Error('WHEP POST returned ' + response.status);
  const answer = await response.text();
  if (!answer.startsWith('v=0')) throw Error('Publisher rejected the offer');
  resource = new URL(response.headers.get('Location'), endpoint).href;
  etag = response.headers.get('ETag');
  await pc.setRemoteDescription({ type: 'answer', sdp: answer });
  if (trickle) {
    await gathered(pc);
    // Keep the original media order and ICE credentials in the standard SDP fragment.
    const fragment = pc.localDescription.sdp.split(/\r?\n/).filter(line =>
      /^(m=|a=mid:|a=ice-ufrag:|a=ice-pwd:|a=candidate:|a=end-of-candidates)/.test(line)).join('\r\n') + '\r\n';
    const patch = await request(resource, { method: 'PATCH', headers: {
      'Content-Type': 'application/trickle-ice-sdpfrag', ...(etag ? { 'If-Match': etag } : {})
    }, body: fragment });
    if (patch.status !== 204) throw Error('WHEP PATCH returned ' + patch.status);
  }
  document.querySelector('#status').textContent = '— ' + videoCodec + ' + Opus';
  return { answer, resource, etag };
};
window.playbackStats = async () => {
  const stats = [...(await pc.getStats()).values()];
  const incoming = kind => stats.find(s => s.type === 'inbound-rtp' && (s.kind || s.mediaType) === kind);
  const v = incoming('video'), a = incoming('audio');
  const canvas = document.createElement('canvas'); canvas.width = canvas.height = 1;
  const ctx = canvas.getContext('2d');
  if (video.videoWidth) ctx.drawImage(video, 0, 0, 1, 1);
  let rms = 0, peakHz = 0;
  if (analyser) {
    const samples = new Float32Array(analyser.fftSize);
    analyser.getFloatTimeDomainData(samples);
    rms = Math.sqrt(samples.reduce((sum, x) => sum + x * x, 0) / samples.length);
    const bins = new Float32Array(analyser.frequencyBinCount); analyser.getFloatFrequencyData(bins);
    let peak = 1; for (let i = 2; i < bins.length; ++i) if (bins[i] > bins[peak]) peak = i;
    peakHz = peak * audioContext.sampleRate / analyser.fftSize;
  }
  const transport = stats.find(s => s.type === 'transport' && s.selectedCandidatePairId);
  const pair = stats.find(s => s.id === transport?.selectedCandidatePairId) ||
    stats.find(s => s.type === 'candidate-pair' && s.state === 'succeeded' && (s.selected || s.nominated));
  const local = stats.find(s => s.id === pair?.localCandidateId), remote = stats.find(s => s.id === pair?.remoteCandidateId);
  return { state: pc.connectionState, iceState: pc.iceConnectionState, gathering: pc.iceGatheringState,
    localCandidates: stats.filter(s => s.type === 'local-candidate').map(s => s.candidateType),
    remoteCandidates: stats.filter(s => s.type === 'remote-candidate').map(s => s.candidateType),
    frames: v?.framesDecoded || 0, audioPackets: a?.packetsReceived || 0,
    audioEnergy: a?.totalAudioEnergy, audioSamples: a?.totalSamplesReceived,
    audioState: audioContext?.state, muted: video.muted, paused: video.paused,
    route: { local: local?.candidateType, remote: remote?.candidateType, protocol: local?.protocol,
      relayProtocol: local?.relayProtocol, remoteRelayProtocol: remote?.relayProtocol },
    videoCodec: stats.find(s => s.id === v?.codecId)?.mimeType,
    audioCodec: stats.find(s => s.id === a?.codecId)?.mimeType,
    pixel: [...ctx.getImageData(0, 0, 1, 1).data], rms, peakHz,
    width: video.videoWidth, height: video.videoHeight, currentTime: video.currentTime };
};
window.stopPlayback = async () => {
  // A normal player closes its media connection as well as its HTTP resource.
  pc?.close();
  if (audioContext && audioContext.state !== 'closed') await audioContext.close();
  if (resource) {
    const closingResource = resource; resource = null;
    const response = await request(closingResource, { method: 'DELETE' });
    if (![200, 204].includes(response.status)) throw Error('WHEP DELETE returned ' + response.status);
  }
};
document.querySelector('#controls').onsubmit = event => {
  event.preventDefault(); window.playbackError = null;
  startPlayback(document.querySelector('#endpoint').value).catch(error => {
    window.playbackError = String(error.message); document.querySelector('#status').textContent = window.playbackError;
  });
};
document.querySelector('#audio').onclick = () => {
  video.muted = false;
  video.play().catch(() => {});
  audioContext?.resume();
};
document.querySelector('#stop').onclick = () => {
  stopPlayback().then(() => document.querySelector('#status').textContent = '— stopped')
    .catch(error => window.playbackError = String(error.message));
};
</script>
</html>
