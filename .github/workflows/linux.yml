name: Linux Build and Package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

env:
  PLUGIN_NAME: obs-vdoninja
  LIBDATACHANNEL_VERSION: v0.20.2
  # Keep the Linux release baseline aligned with build.yml and INSTALL.md.
  OBS_VERSION: 32.2.0
  OBS_SOURCE_REF: 32.2.0
  OBS_SOURCE_TAG: 32.2.0

jobs:
  build-linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libssl-dev \
            libpthread-stubs0-dev \
            libcurl4-openssl-dev \
            libjsoncpp-dev \
            python3-pyqt6 \
            xvfb \
            xauth

      - name: Build OBS SDK
        run: |
          git clone --depth 1 --branch ${{ env.OBS_SOURCE_REF }} --recurse-submodules https://github.com/obsproject/obs-studio.git obs-studio
          cd obs-studio
          git checkout "refs/tags/${{ env.OBS_SOURCE_TAG }}" || git checkout ${{ env.OBS_SOURCE_TAG }}
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ccache \
            extra-cmake-modules \
            lsb-release \
            dh-cmake \
            libglib2.0-dev \
            libavcodec-dev \
            libavdevice-dev \
            libavfilter-dev \
            libavformat-dev \
            libavutil-dev \
            libswresample-dev \
            libswscale-dev \
            libjansson-dev \
            libx11-xcb-dev \
            libgles2-mesa-dev \
            libwayland-dev \
            libpipewire-0.3-dev \
            libpulse-dev \
            libx264-dev \
            libmbedtls-dev \
            libgl1-mesa-dev \
            uthash-dev \
            libsimde-dev \
            libluajit-5.1-dev \
            python3-dev \
            libx11-dev \
            libxcb-randr0-dev \
            libxcb-shm0-dev \
            libxcb-xinerama0-dev \
            libxcb-composite0-dev \
            libxinerama-dev \
            libxcb1-dev \
            libxcb-xfixes0-dev \
            swig \
            libcmocka-dev \
            libxss-dev \
            libglvnd-dev \
            libxkbcommon-dev \
            libatk1.0-dev \
            libatk-bridge2.0-dev \
            libxcomposite-dev \
            libxdamage-dev \
            libasound2-dev \
            libfdk-aac-dev \
            libfontconfig-dev \
            libfreetype6-dev \
            libjack-jackd2-dev \
            libsndio-dev \
            libspeexdsp-dev \
            libudev-dev \
            libv4l-dev \
            libva-dev \
            libvlc-dev \
            libpci-dev \
            libdrm-dev \
            nlohmann-json3-dev \
            libwebsocketpp-dev \
            libasio-dev \
            libqrcodegencpp-dev \
            libffmpeg-nvenc-dev \
            libsrt-openssl-dev \
            qt6-base-dev \
            libqt6svg6-dev \
            qt6-base-private-dev \
            libvpl-dev \
            libvpl2
          cmake -S . -B build_ubuntu \
            --preset ubuntu-ci \
            -DENABLE_BROWSER=OFF \
            -DENABLE_SCRIPTING=OFF \
            -DENABLE_RIST=OFF \
            -DENABLE_NEW_MPEGTS_OUTPUT=OFF \
            -DOBS_VERSION_OVERRIDE=${{ env.OBS_VERSION }}
          cmake --build build_ubuntu --config RelWithDebInfo --parallel
          cmake --install build_ubuntu --prefix ${{ github.workspace }}/obs-sdk
          echo "=== OBS SDK install tree ==="
          find ${{ github.workspace }}/obs-sdk -type f | head -100
          # Create symlinks from multiarch path to standard path
          mkdir -p ${{ github.workspace }}/obs-sdk/lib
          for f in ${{ github.workspace }}/obs-sdk/lib/x86_64-linux-gnu/*; do
            [ -e "$f" ] && ln -sf "$f" ${{ github.workspace }}/obs-sdk/lib/$(basename "$f") 2>/dev/null || true
          done
          # Create soname symlinks for the current OBS build version.
          obs_soname="$(find "${{ github.workspace }}/obs-sdk/lib" -maxdepth 1 -type f -name 'libobs.so.*' ! -name 'libobs.so' | head -1 | xargs -r basename)"
          if [ -n "$obs_soname" ]; then
            ln -sf "$obs_soname" ${{ github.workspace }}/obs-sdk/lib/libobs.so
          fi
          obs_frontend_soname="$(find "${{ github.workspace }}/obs-sdk/lib" -maxdepth 1 -type f -name 'libobs-frontend-api.so.*' ! -name 'libobs-frontend-api.so' | head -1 | xargs -r basename)"
          if [ -n "$obs_frontend_soname" ]; then
            ln -sf "$obs_frontend_soname" ${{ github.workspace }}/obs-sdk/lib/libobs-frontend-api.so
          fi
          # Fix pkgconfig files to use correct libdir
          if [ -d "${{ github.workspace }}/obs-sdk/lib/pkgconfig" ]; then
            sed -i "s|libdir=.*|libdir=${{ github.workspace }}/obs-sdk/lib|g" ${{ github.workspace }}/obs-sdk/lib/pkgconfig/*.pc 2>/dev/null || true
            cat ${{ github.workspace }}/obs-sdk/lib/pkgconfig/libobs.pc 2>/dev/null || echo "No libobs.pc"
          fi
          echo "=== After symlinks ==="
          ls -la ${{ github.workspace }}/obs-sdk/lib/

      - name: Build libdatachannel
        run: |
          git clone --depth 1 --branch ${{ env.LIBDATACHANNEL_VERSION }} https://github.com/paullouisageneau/libdatachannel.git
          cd libdatachannel
          git submodule update --init --recursive --depth 1
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DNO_EXAMPLES=ON \
            -DNO_TESTS=ON \
            -DUSE_GNUTLS=OFF \
            -DUSE_NICE=OFF \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build
          sudo cmake --install build

      - name: Disable vendored libdatachannel headers
        run: |
          if [ -d "${{ github.workspace }}/deps/libdatachannel" ]; then
            mv "${{ github.workspace }}/deps/libdatachannel" "${{ github.workspace }}/deps/libdatachannel-vendored-disabled"
          fi

      - name: Configure Plugin
        run: |
          echo "=== Checking OBS libraries ==="
          ls -la ${{ github.workspace }}/obs-sdk/lib/ || echo "No lib dir"
          find ${{ github.workspace }}/obs-sdk -name "*.so*" -o -name "*.a" | head -20
          # Don't set PKG_CONFIG_PATH to avoid pkg-config finding OBS with wrong paths
          # Force CMake to use find_library which will get full paths
          export OBS_LIB_DIR="${{ github.workspace }}/obs-sdk/lib"
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DBUNDLE_LINUX_RUNTIME=ON \
            -DBUILD_NATIVE_MEDIA_LINKED_GATE=ON \
            -DBUILD_PUBLISHER_TOOL=ON \
            -DCMAKE_PREFIX_PATH="/usr/local;${{ github.workspace }}/obs-sdk;${OBS_LIB_DIR}/cmake/libobs;${OBS_LIB_DIR}/cmake/obs-frontend-api" \
            -DCMAKE_LIBRARY_PATH="${OBS_LIB_DIR}" \
            -DOBS_SDK_PATH="${{ github.workspace }}/obs-sdk" \
            -DCMAKE_EXE_LINKER_FLAGS="-L${OBS_LIB_DIR}" \
            -DCMAKE_SHARED_LINKER_FLAGS="-L${OBS_LIB_DIR}"

      - name: Build Plugin
        run: cmake --build build

      - name: Test linked native media and alpha composition
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/obs-sdk/lib:${{ github.workspace }}/obs-sdk/lib/x86_64-linux-gnu:/usr/local/lib
        run: ctest --test-dir build -L release-linked --no-tests=error --output-on-failure

      - name: Package
        run: |
          cmake --install build --prefix install
          cp LICENSE install/
          cp INSTALL.md install/
          cp QUICKSTART.md install/
          cp README.md install/
          cp THIRD_PARTY_LICENSES.md install/
          cp RELEASE_COMPLIANCE.md install/
          cp scripts/install-package-linux.sh install/install.sh
          cp scripts/uninstall-package-linux.sh install/uninstall.sh
          chmod +x install/install.sh
          chmod +x install/uninstall.sh
          cd install
          tar -czvf ../${{ env.PLUGIN_NAME }}-linux-x86_64.tar.gz .

      - name: Test Linux installer and uninstaller
        run: sudo python3 tests/test-linux-package.py

      - name: Validate extracted Linux runtime and OBS API
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/obs-sdk/lib:${{ github.workspace }}/obs-sdk/lib/x86_64-linux-gnu
        run: |
          package_check_dir="$(mktemp -d)"
          trap 'rm -rf "$package_check_dir"' EXIT
          tar -xzf "${{ env.PLUGIN_NAME }}-linux-x86_64.tar.gz" -C "$package_check_dir"
          mapfile -t plugins < <(find "$package_check_dir" -name obs-vdoninja.so -type f)
          test "${#plugins[@]}" -eq 1
          python3 scripts/validate-linux-package.py "${plugins[0]}" --obs-version "${{ env.OBS_VERSION }}"

      - name: Test official OBS runtime compatibility
        run: |
          compatibility_dir="$(mktemp -d)"
          trap 'rm -rf "$compatibility_dir"' EXIT
          mkdir "$compatibility_dir/plugin"
          tar -xzf "${{ env.PLUGIN_NAME }}-linux-x86_64.tar.gz" -C "$compatibility_dir/plugin"
          mapfile -t plugins < <(find "$compatibility_dir/plugin" -name obs-vdoninja.so -type f)
          test "${#plugins[@]}" -eq 1
          # Test patch upgrades with the same 32.2.0-built binary. Keep older
          # runtimes as negative controls; do not silently widen support.
          for version in 32.2.0 32.2.1 32.2.2 32.1.2 32.0.4; do
            runtime_dir="$compatibility_dir/$version"
            mkdir "$runtime_dir"
            curl --fail --location --retry 3 \
              "https://github.com/obsproject/obs-studio/releases/download/$version/OBS-Studio-$version-Ubuntu-24.04-x86_64.deb" \
              --output "$runtime_dir/obs.deb"
            dpkg-deb --extract "$runtime_dir/obs.deb" "$runtime_dir"
            expect=incompatible
            initialization_args=()
            if [[ "$version" == 32.2.* ]]; then
              expect=compatible
              initialization_args=(--initialize)
            fi
            LD_LIBRARY_PATH="$runtime_dir/usr/local/lib/x86_64-linux-gnu" \
              timeout 60s xvfb-run -a --server-args='-screen 0 1280x720x24 -extension GLX' \
              /usr/bin/python3 scripts/validate-linux-obs-runtime.py "${plugins[0]}" \
              "$compatibility_dir/plugin/share/obs/obs-plugins/obs-vdoninja" \
              --runtime-version "$version" --expect "$expect" "${initialization_args[@]}"
          done

      - name: Test installer with a fully installed Ubuntu OBS
        run: |
          curl --fail --location --retry 3 \
            https://github.com/obsproject/obs-studio/releases/download/32.2.2/OBS-Studio-32.2.2-Ubuntu-24.04-x86_64.deb \
            --output obs-runtime.deb
          docker run --rm -v "${{ github.workspace }}:/repo:ro" ubuntu:24.04 \
            bash /repo/tests/test-ubuntu-package.sh \
            /repo/${{ env.PLUGIN_NAME }}-linux-x86_64.tar.gz /repo/obs-runtime.deb

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_NAME }}-linux-x86_64
          path: ${{ env.PLUGIN_NAME }}-linux-x86_64.tar.gz
