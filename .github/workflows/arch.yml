name: Arch Build and Package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 25
    steps:
      # checkout otherwise falls back to an archive, which has no VCS history
      # for makepkg's development version or exact-revision source clone.
      - name: Install Git before checkout
        run: pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build, test, install and remove Arch package
        env:
          ARCH_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/arch
        run: bash tests/test-arch-package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: obs-vdoninja-arch-x86_64
          path: artifacts/arch/
