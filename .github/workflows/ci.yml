name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # Run tests on Linux (tests don't require OBS)
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Release-linked wiring policy
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -ExecutionPolicy Bypass -File tests/test-release-linked-wiring.ps1

      - name: Release-linked wiring policy mutations
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -ExecutionPolicy Bypass -File tests/test-release-linked-wiring-policy-mutations.ps1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libssl-dev locales ffmpeg
          sudo localedef -i en_US -f ISO-8859-1 en_US.ISO8859-1

      - name: Configure CMake (tests only)
        run: cmake -B build -DBUILD_TESTS=ON -DBUILD_PLUGIN=OFF -DCMAKE_BUILD_TYPE=Debug

      - name: Linux package regression tests (isolated filesystem)
        run: sudo python3 tests/test-linux-package.py

      - name: Build tests
        run: cmake --build build --target vdoninja-tests -j$(nproc)

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate macOS dependency deployment targets
        run: bash tests/test-macos-deployment-target.sh

      - name: Validate E2E performance measurements
        run: |
          node --test tests/test-obs-performance.cjs tests/test-video-continuity.cjs tests/test-audio-continuity.cjs tests/test-presentation-continuity.cjs tests/test-udp-loss-proxy.cjs tests/test-rtc-timing-probes.cjs tests/test-application-diagnostics.cjs
          node --test tests/test-recorded-sequence.cjs
          node --test tests/test-capture-boundary.cjs tests/test-publish-encoder-mode.cjs
          node --test tests/test-viewer-stats.cjs tests/test-audio-sink-coverage.cjs tests/test-audio-capture-worklet.cjs tests/test-raw-audio-capture-worker.cjs
          python3 tests/test-rtp-pcap.py
          python3 tests/test-rtp-timing-analysis.py
          python3 tests/test-receiver-timing-log.py
          python3 tests/test-receiver-buffer-sync.py
          python3 tests/test-av-playout.py
          python3 tests/test-compositor-timing.py

  # Run the same suite under AddressSanitizer and UndefinedBehaviorSanitizer.
  # The suite includes byte-level fuzzers for VP9/H.264 payload parsing, RTCP
  # feedback/NACK parsing, audio RED construction, data-channel messages, and
  # signaling normalization. Without a sanitizer those fuzzers only catch hard
  # crashes -- an out-of-bounds read or signed overflow passes silently.
  sanitizers:
    name: Unit Tests (ASan + UBSan)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libssl-dev locales
          sudo localedef -i en_US -f ISO-8859-1 en_US.ISO8859-1

      - name: Configure CMake (tests only, sanitized)
        run: |
          cmake -B build-asan \
            -DBUILD_TESTS=ON \
            -DBUILD_PLUGIN=OFF \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build tests
        run: cmake --build build-asan --target vdoninja-tests -j$(nproc)

      - name: Run tests
        env:
          # Leak detection is off: this gate is for memory-safety and UB in the
          # parsers, and LeakSanitizer would also flag one-time allocations in
          # third-party test scaffolding that are not defects.
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-asan --output-on-failure

  # Format check
  format:
    name: Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-14

      - name: Check formatting
        run: |
          find src tests \( -name "*.cpp" -o -name "*.h" \) -print0 | xargs -0 clang-format-14 --dry-run --Werror
